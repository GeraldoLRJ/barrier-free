<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Barrier Free</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 250px;
      padding: 10px;
      text-align: center;
    }
    button {
      color: white;
      border: none;
      padding: 10px 15px;
      font-size: 14px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      margin-bottom: 8px;
    }
    #aiAnalyzeBtn {
      background-color: #9C27B0;
    }
    #aiAnalyzeBtn:hover {
      background-color: #7B1FA2;
    }
    #voiceBtn {
      background-color: #2196F3;
    }
    #voiceBtn:hover {
      background-color: #1976D2;
    }
    #voiceBtn.active {
      background-color: #f44336;
    }
    #voiceBtn.active:hover {
      background-color: #d32f2f;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #333;
    }
  </style>
</head>
<body>
  <h3>Acessibilidade DOM</h3>
  <button id="aiAnalyzeBtn">📝 Resumir com IA</button>
  <button id="voiceBtn">🎤 Ativar Voz</button>
  <div id="status"></div>
  
  <script src="popup.js"></script>
</body>
</html>
